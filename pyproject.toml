[project]
name = "tts-mcp-server"
version = "0.1.0"
description = "macOS TTS notification server for Claude Code"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "mlx-audio>=0.4.6",
    "sounddevice>=0.5.0",
    "numpy>=2.0",
    "soundfile>=0.12.1",
]

[project.scripts]
tts-mcp-server = "tts_server:main"
tts-mcp-init = "tts_server:init"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tts_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]
