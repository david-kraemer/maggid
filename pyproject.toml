[project]
name = "tts-mcp-server"
version = "0.1.0"
description = "macOS TTS notification server for Claude Code"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "mlx-audio>=0.4.6",
    "sounddevice>=0.5.0",
    "numpy>=2.0",
    "soundfile>=0.12.1",
    "en_core_web_sm@https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
tts-mcp-server = "tts_server:main"
tts-mcp-init = "tts_server:init"
